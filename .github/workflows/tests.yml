name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: paper2cards examples/data-structures.pdf
      - run: paper2cards tests/fixtures/v0.1.0-cards.json -o output/legacy
      - if: matrix.python == '3.13'
        run: python -m pip install playwright
      - if: matrix.python == '3.13'
        name: Exercise offline review in Chrome or Edge
        run: python tests/browser_review.py --channel ${{ runner.os == 'Windows' && 'msedge' || 'chrome' }} output/legacy/review.html output/data-structures/review.html
