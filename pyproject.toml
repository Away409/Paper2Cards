[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2cards"
version = "0.2.0"
description = "Turn study PDFs into revision notes and flashcards with page-level evidence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=6.10,<7"]

[project.scripts]
paper2cards = "paper2cards.cli:main"

[tool.setuptools]
packages = ["paper2cards"]
